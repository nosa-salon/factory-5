<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام تسجيل الأعطال</title>
    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <style>
        body {
            background-color: #f1f1f1;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
            background-color: #fff;
        }
        .login-title {
            text-align: center;
            color: #333;
            margin-bottom: 1.5rem;
        }
        .form-label {
            font-weight: bold;
            color: #555;
        }
        .btn-primary {
            width: 100%;
            padding: 0.75rem;
            background-color: #0d6efd;
            border: none;
        }
        .btn-primary:hover {
            background-color: #0b5ed7;
        }
        .footer-link {
            text-align: center;
            margin-top: 1rem;
        }
        .footer-link a {
            color: #0d6efd;
            text-decoration: none;
        }
        .alert {
            display: none; /* مخفي افتراضياً */
            margin-bottom: 1rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="login-card mx-auto">
            <h2 class="login-title">تسجيل الدخول</h2>
            
            <!-- رسالة خطأ -->
            <div id="errorMessage" class="alert alert-danger alert-dismissible fade show" role="alert">
                اسم المستخدم أو كلمة المرور غير صحيحة.
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="userSelect" class="form-label">اختر اسم المستخدم:</label>
                    <select class="form-select" id="userSelect" required>
                        <option value="" disabled selected>-- اضغط للاختيار --</option>
                        
                        <!-- الخيار الجديد ليك كمدير -->
                        <option value="admin@factory.com">المدير العام (Admin)</option>
                        
                        <option value="مصنع 5 (المشرفين)">مصنع 5 (المشرفين)</option>
                        <option value="الرؤية (الإدارة)">الرؤية (الإدارة)</option>
                        
                    </select>
                </div>
                
                <div class="mb-3">
                    <label for="password" class="form-label">كلمة المرور:</label>
                    <input type="password" class="form-control" id="password" required placeholder="أدخل كلمة المرور">
                </div>

                <button type="submit" class="btn btn-primary">دخول</button>
            </form>

            <div class="footer-link">
                <a href="index.html">العودة للصفحة الرئيسية</a>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- ملف الجافا سكريبت الخاص بك -->
    <!-- يجب التأكد من وجود هذا الملف في نفس المجلد -->
    <script type="module" src="login.js"></script>

</body>
</html>
